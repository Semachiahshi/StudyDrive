<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1d1d1f">
  <h2 style="font-size:20px;font-weight:600;margin:0 0 16px">Přihlášení do StudyDrive</h2>
  <p style="margin:0 0 8px;font-size:15px;line-height:1.5">Tvůj přihlašovací kód:</p>
  <p style="font-size:32px;font-weight:600;letter-spacing:6px;margin:0 0 24px">{{ .Token }}</p>
  <p style="margin:0 0 16px;font-size:15px;line-height:1.5">Zadej ho v aplikaci. Kód platí 15 minut.</p>
  <p style="margin:0 0 24px;font-size:13px;line-height:1.5;color:#6e6e73">
    Na počítači se můžeš přihlásit i odkazem:
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="color:#0066cc">přihlásit se</a>.
    Na iPhonu v aplikaci z plochy použij raději kód.
  </p>
  <p style="margin:0;font-size:12px;color:#86868b">Pokud o přihlášení nežádáš, tento e-mail ignoruj.</p>
</div>
