<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1d1d1f">
  <h2 style="font-size:20px;font-weight:600;margin:0 0 16px">Pozvánka do StudyDrive</h2>
  <p style="margin:0 0 24px;font-size:15px;line-height:1.5">
    Byl ti vytvořen soukromý účet ve StudyDrive. Potvrď ho tímto odkazem:
  </p>
  <p style="margin:0 0 24px">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite"
       style="display:inline-block;background:#0071e3;color:#fff;text-decoration:none;padding:10px 18px;border-radius:980px;font-size:15px">Potvrdit účet</a>
  </p>
  <p style="margin:0;font-size:13px;line-height:1.5;color:#6e6e73">
    Příště se přihlásíš jen e-mailem — pošleme ti jednorázový kód.
  </p>
</div>
